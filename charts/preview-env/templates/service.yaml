apiVersion: v1
kind: Service
metadata:
  name: {{ include "preview-env.name" . }}
  labels:
    {{- include "preview-env.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "preview-env.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP