{{- if .Values.externalSecret.enabled }}
# Preview Scope secret: ESO syncs the shared-sandbox (Aurora)
# credentials from AWS Secrets Manager into this namespace. Never in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "preview-env.name" . }}-db
  labels:
    {{- include "preview-env.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef.name }}
    kind: {{ .Values.externalSecret.storeRef.kind }}
  target:
    name: {{ include "preview-env.name" . }}-db
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecret.remoteProperty }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.externalSecret.remoteProperty }}
{{- end }}